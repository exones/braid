# Spike 0057 (do not merge): whole verify:full jobs, baseline vs TEMP on D:, and a sharded layout.
name: spike
on:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  full:
    name: full ${{ matrix.variant }} ${{ matrix.sample }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, tempd]
        sample: [1, 2, 3]
    env:
      BRAID_REQUIRE_CLEAN: "1"
      BRAID_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: TEMP on D
        if: matrix.variant == 'tempd'
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $t | Out-Null
          "TEMP=$t", "TMP=$t" | Out-File $env:GITHUB_ENV -Append
      - name: Require Pester 5.5
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
            Install-PSResource -Name Pester -Version 5.7.1 -Repository PSGallery -TrustRepository -Scope CurrentUser
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Verify
        run: npm run verify:full
  rest:
    name: sharded rest ${{ matrix.sample }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    env:
      BRAID_REQUIRE_CLEAN: "1"
      BRAID_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: TEMP on D
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $t | Out-Null
          "TEMP=$t", "TMP=$t" | Out-File $env:GITHUB_ENV -Append
      - name: Require Pester 5.5
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
            Install-PSResource -Name Pester -Version 5.7.1 -Repository PSGallery -TrustRepository -Scope CurrentUser
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Everything but node --test
        run: |
          foreach ($s in 'scripts/Test-DocsGate.ps1', 'test/fixtures/oidc-release/Test-OidcReleaseGuard.ps1', 'test/fixtures/docs-gate/Test-DocsGateNegatives.ps1', 'test/fixtures/install-policy/Test-InstallPolicy.ps1', 'test/fixtures/node-toolchain/Test-NodeToolchain.ps1', 'scripts/Test-Pester.ps1') {
            pwsh -NoProfile -File $s; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          npm run typecheck; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/Test-Package.ps1; exit $LASTEXITCODE
  test:
    name: sharded test ${{ matrix.shard }} ${{ matrix.sample }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        sample: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: TEMP on D
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $t | Out-Null
          "TEMP=$t", "TMP=$t" | Out-File $env:GITHUB_ENV -Append
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: node --test shard
        run: node --test --test-reporter dot --test-shard=${{ matrix.shard }}/3 test
  gate:
    name: verify (windows-latest) sharded
    needs: [rest, test]
    runs-on: windows-latest
    steps:
      - run: Write-Output 'all shards and the rest passed'
