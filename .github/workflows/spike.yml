# Spike 0057 (do not merge): paired node --test runs (baseline and variant on one runner), and sharding.
name: spike
on:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  paired:
    name: paired ${{ matrix.variant }} ${{ matrix.sample }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [tempd, devdrive, gitcfg, ncc, all]
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Dev drive
        if: matrix.variant == 'devdrive'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 8GB
          drive-type: Fixed
          trusted-dev-drive: true
          env-mapping: |
            DEVTEMP,{{ DEV_DRIVE }}/tmp
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Paired runs
        run: pwsh -NoProfile -File spike/paired.ps1 -Variant ${{ matrix.variant }} -Sample ${{ matrix.sample }}
  shard:
    name: shard ${{ matrix.shard }} ${{ matrix.sample }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        sample: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: P node --test shard
        run: node --test --test-reporter dot --test-shard=${{ matrix.shard }}/3 test
