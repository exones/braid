# Spike 0057 (do not merge): Windows verify:full split into one step per phase, per variant.
name: spike
on:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
jobs:
  verify:
    name: ${{ matrix.variant }} ${{ matrix.sample }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, defender, devdrive, conc8, conc16, gitcfg, ncc, all]
        sample: [1, 2]
    env:
      BRAID_REQUIRE_CLEAN: "1"
      BRAID_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      V: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Probe
        run: |
          "image $env:ImageOS $env:ImageVersion; cpus $([Environment]::ProcessorCount); TEMP $env:TEMP; workspace $env:GITHUB_WORKSPACE"
          Get-MpComputerStatus | Select-Object AMRunningMode, RealTimeProtectionEnabled, OnAccessProtectionEnabled, IsTamperProtected | Format-List | Out-String
          "exclusions: $((Get-MpPreference).ExclusionPath -join '; ')"
          Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystem, Size, SizeRemaining | Out-String
          git config --system --list --show-origin
          "WORK=$env:GITHUB_WORKSPACE" | Out-File $env:GITHUB_ENV -Append
      - name: Variant defender
        if: matrix.variant == 'defender' || matrix.variant == 'all'
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:TEMP, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, 'C:\Program Files\Git')) { Add-MpPreference -ExclusionPath $p }
          foreach ($p in 'node.exe', 'git.exe', 'pwsh.exe') { Add-MpPreference -ExclusionProcess $p }
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled | Format-List | Out-String
      - name: Variant devdrive
        if: matrix.variant == 'devdrive' || matrix.variant == 'all'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 8GB
          drive-type: Fixed
          workspace-copy: true
          trusted-dev-drive: true
          env-mapping: |
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp
      - name: Variant devdrive (paths)
        if: matrix.variant == 'devdrive' || matrix.variant == 'all'
        run: |
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          "WORK=$env:DEV_DRIVE_WORKSPACE" | Out-File $env:GITHUB_ENV -Append
          "TEMP $env:TEMP; workspace $env:DEV_DRIVE_WORKSPACE"
          fsutil devdrv query $env:DEV_DRIVE
      - name: Variant env
        run: |
          $lines = @()
          if ($env:V -in 'conc8', 'all') { $lines += 'CONC=--test-concurrency=8' }
          if ($env:V -eq 'conc16') { $lines += 'CONC=--test-concurrency=16' }
          if ($env:V -in 'gitcfg', 'all') {
            $tpl = Join-Path $env:RUNNER_TEMP 'git-template'
            New-Item -ItemType Directory -Force $tpl | Out-Null
            $kv = @(@('core.fscache', 'true'), @('core.preloadindex', 'true'), @('gc.auto', '0'), @('maintenance.auto', 'false'), @('core.fsmonitor', 'false'), @('core.untrackedCache', 'false'))
            $lines += "GIT_CONFIG_COUNT=$($kv.Count)"
            for ($i = 0; $i -lt $kv.Count; $i++) { $lines += "GIT_CONFIG_KEY_$i=$($kv[$i][0])"; $lines += "GIT_CONFIG_VALUE_$i=$($kv[$i][1])" }
            $lines += "GIT_TEMPLATE_DIR=$tpl"
          }
          if ($env:V -in 'ncc', 'all') { $lines += "NODE_COMPILE_CACHE=$(Join-Path $env:RUNNER_TEMP 'ncc')" }
          $lines | ForEach-Object { $_ }
          if ($lines.Count) { $lines | Out-File $env:GITHUB_ENV -Append }
      - name: Require Pester 5.5
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
            Install-PSResource -Name Pester -Version 5.7.1 -Repository PSGallery -TrustRepository -Scope CurrentUser
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true
          cache: npm
      - name: npm ci
        working-directory: ${{ env.WORK }}
        run: npm ci
      - name: P docs-gate
        working-directory: ${{ env.WORK }}
        run: pwsh -NoProfile -File scripts/Test-DocsGate.ps1; exit $LASTEXITCODE
      - name: P oidc-release
        working-directory: ${{ env.WORK }}
        run: pwsh -NoProfile -File test/fixtures/oidc-release/Test-OidcReleaseGuard.ps1; exit $LASTEXITCODE
      - name: P docs-gate negatives
        working-directory: ${{ env.WORK }}
        run: pwsh -NoProfile -File test/fixtures/docs-gate/Test-DocsGateNegatives.ps1; exit $LASTEXITCODE
      - name: P install-policy
        working-directory: ${{ env.WORK }}
        run: pwsh -NoProfile -File test/fixtures/install-policy/Test-InstallPolicy.ps1; exit $LASTEXITCODE
      - name: P node-toolchain
        working-directory: ${{ env.WORK }}
        run: pwsh -NoProfile -File test/fixtures/node-toolchain/Test-NodeToolchain.ps1; exit $LASTEXITCODE
      - name: P pester
        working-directory: ${{ env.WORK }}
        run: pwsh -NoProfile -File scripts/Test-Pester.ps1; exit $LASTEXITCODE
      - name: P typecheck
        working-directory: ${{ env.WORK }}
        run: npm run typecheck
      - name: P build
        working-directory: ${{ env.WORK }}
        run: npm run build
      - name: P node --test
        working-directory: ${{ env.WORK }}
        run: |
          $extra = @()
          if ($env:CONC) { $extra += $env:CONC }
          node --test --test-reporter spec --test-reporter-destination stdout --test-reporter junit --test-reporter-destination "$env:RUNNER_TEMP/junit.xml" @extra test
          exit $LASTEXITCODE
      - name: P package
        working-directory: ${{ env.WORK }}
        run: pwsh -NoProfile -File scripts/Test-Package.ps1; exit $LASTEXITCODE
      - name: Bench process start
        if: always()
        working-directory: ${{ env.WORK }}
        run: node spike/bench.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.variant }}-${{ matrix.sample }}
          path: ${{ runner.temp }}/junit.xml
