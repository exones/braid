# Windows/Linux verify ran for PR #1 before the packed-tarball upload existed.
# The upload step in this revision has not been observed on GitHub yet.
#
# Pins, checked 2026-11-03:
# - actions/checkout v7.0.1 (2026-07-17), commit 3d3c42e5aac5ba805825da76410c181273ba90b1.
#   Current checkout major. v7 refuses unsafe fork checkout for pull_request_target.
# - actions/setup-node v7.1.0 (2026-10-08), commit 949feb2413d6458794dcd2491c4babbbce0c15c1.
#   Current setup-node release. node-version "26" is the seed contract's Actions spec.
#   check-latest avoids a cached 26.x older than the >=26.13.0 engine floor.
#     Hosted images cache Node 22 and 24, not Node 26.
#
# PowerShell baseline, from actions/runner-images on 2026-11-03:
# - Windows Server 2025 readme (image 20261021.299.1) lists PowerShell 7.6.7.
#   The 2026-10-30 Windows image update moves that line from 7.6.7 to 7.6.9.
# - Ubuntu 24.04 and Ubuntu 26.04 readmes list PowerShell 7.6.9.
# - ubuntu-latest is moving to Ubuntu 26.04 through 2026-11-19; both images are above 7.6.0.
# The version step fails the job if a runner is below 7.6.0. No second PowerShell is installed.
#
# actions/upload-artifact v7.0.2 (2026-10-07), commit cf430e030ddbb5b0abf93d22962f4752f3646cd9.
# The tag points at that commit. v7.0.2 was the latest release on 2026-11-03.
# Artifact upload needs actions: write. contents stays read. This workflow does not publish.
name: CI

# PR branches are covered by pull_request; push runs only for the shared branches,
# so one push to a PR branch doesn't run the suite twice. A push that only changes
# epics/ (past records) or backlog/ (Backlog.md tasks) skips CI; pull requests always run.
on:
  push:
    branches: [main, 'epic/**']
    paths-ignore: ['epics/**', 'backlog/**']
  pull_request:

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require PowerShell 7.6
        shell: pwsh
        run: |
          $version = $PSVersionTable.PSVersion
          Write-Output "pwsh $version"
          if ($version -lt [version]'7.6.0') {
            Write-Error "pwsh $version is below the required 7.6.0 baseline."
            exit 1
          }

      - name: Require Pester 5.5
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
            Install-PSResource -Name Pester -Version 5.7.1 -Repository PSGallery -TrustRepository -Scope CurrentUser
          }
          Get-Module -ListAvailable -Name Pester | Sort-Object Version -Descending | Select-Object -First 1 Name, Version

      - name: Setup Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Verify
        shell: pwsh
        env:
          BRAID_REQUIRE_CLEAN: "1"
          BRAID_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run verify:full

      - name: Upload packed tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: braid-package-${{ matrix.os }}
          path: artifacts/package/
          if-no-files-found: error
