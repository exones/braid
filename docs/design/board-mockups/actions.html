<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>braid board – actions mockup</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mut:#6b7385;--line:#e2e5ec;--acc:#3b5bdb;--lane:#eceef3;--chip:#e8ebf3;--dis:#a3a9b8;--disbg:#f3f4f7;--okbg:#e7f6ec;--ok:#15703a;--badbg:#fff1f1;--bad:#8f1f1f;--warnbg:#fff6e0;--warn:#7a4d00;--code:#eef0f5;--tip:#1d2330;--tipfg:#fff;--shade:#1d233088;--rev:#7c3aed;--prog:#2563eb;--done:#16a34a}
.dark{--bg:#14171f;--card:#1d222d;--ink:#e6e9f0;--mut:#98a1b5;--line:#2c3342;--acc:#7f9bff;--lane:#191d27;--chip:#2a3040;--dis:#5d667a;--disbg:#212633;--okbg:#14301f;--ok:#6fd695;--badbg:#3a1a1c;--bad:#ff9a9a;--warnbg:#38300f;--warn:#f2c46b;--code:#2a3040;--tip:#e6e9f0;--tipfg:#14171f;--shade:#000a}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}header .sp{flex:1}
.note{padding:6px 20px;color:var(--mut);font-size:12px}.cnt{font-size:12px;color:var(--mut)}
.lanes{display:grid;gap:12px;padding:12px 20px;align-items:start}
.lane{background:var(--lane);border-radius:10px;padding:10px;min-height:120px}
.lane h3{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}.l-todo{background:#94a3b8}.l-prog{background:var(--prog)}.l-rev{background:var(--rev)}.l-done{background:var(--done)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px #0001}
.card .id{color:var(--mut);font-size:12px}.card .t{font-weight:600;margin:2px 0 6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--mut)}
.bar{height:5px;background:var(--chip);border-radius:3px;flex:1;min-width:50px;overflow:hidden}.bar i{display:block;height:100%;background:var(--done)}
.strands{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.strand{display:flex;gap:6px;align-items:center;padding:4px 0;font-size:13px}.sid{color:var(--mut);font-size:12px;width:16px}
.actions{margin-top:8px;display:flex;gap:6px;align-items:center}
button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;gap:5px;align-items:center}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
button.merge{background:var(--rev);border-color:var(--rev);color:#fff;font-weight:600}
button:disabled{color:var(--dis);background:var(--disbg);border-color:var(--line);cursor:not-allowed}
button.ic{padding:2px 6px;border-color:transparent;background:none;color:var(--mut)}button.ic:hover{color:var(--acc);background:var(--chip)}
.tp{position:relative}.tp::after{content:attr(data-tip);display:none;position:absolute;left:0;top:28px;width:250px;z-index:9;background:var(--tip);color:var(--tipfg);font:12px/1.4 system-ui,sans-serif;font-weight:400;padding:6px 9px;border-radius:6px;text-align:left;box-shadow:0 4px 12px #0003;white-space:normal}
.tp:hover::after,.tp.show::after{display:block}.tp.r::after{left:auto;right:0}
.state{margin-top:8px;font-size:12.5px;border-radius:6px;padding:4px 7px;border-left:3px solid;display:flex;gap:6px;align-items:center}
.s-run{background:var(--chip);border-color:var(--prog)}.s-ok{background:var(--okbg);color:var(--ok);border-color:var(--done)}.s-bad{background:var(--badbg);color:var(--bad);border-color:#dc2626}.s-warn{background:var(--warnbg);color:var(--warn);border-color:#f59e0b}
.state small{display:block;color:var(--mut)}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--prog);border-radius:50%;animation:sp 1s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
.veil{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;z-index:20}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:12px;width:480px;padding:18px 20px;box-shadow:0 12px 40px #0005}
.dlg h2{margin:0 0 2px;font-size:17px}.dlg .sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 12px;font-size:13px;margin:0 0 12px}.kv dt{color:var(--mut)}.kv dd{margin:0}
code{background:var(--code);padding:0 4px;border-radius:4px;font-size:12.5px}
.chk{display:flex;gap:6px;align-items:center}.ok{color:var(--done)}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.dlg button{font-size:13px;padding:5px 14px}
.dlg .state{margin:0 0 10px}
</style></head><body>
<header><b>braid · attention board</b><span class="cnt">sample · braids/</span><span class="sp"></span><span class="cnt">local · session token set · refreshes every 30 s</span></header>
<div class="note" id="note"></div><div id="app"></div>
<script>
const svg=p=>'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const PLAY=svg('<path d="M7 4l13 8-13 8z" fill="currentColor"/>'),MERGE=svg('<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="14" r="2.5"/><path d="M6 8.5v7M18 11.5c0-4-5-2-10.5-4.5"/>'),
OPEN=svg('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),CHK=svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>');
const dot=c=>'<span class="dot '+c+'"></span>';
// action buttons; dis = tooltip reason (button disabled), show = tooltip pinned open
const btn=(cls,icon,label,dis,show)=>'<button class="'+cls+(dis?' tp':'')+(show?' show':'')+'"'+(dis?' disabled data-tip="'+dis+'"':'')+'>'+icon+' '+label+'</button>';
const start=(dis,show)=>btn('pri',PLAY,'Start',dis,show),merge=(dis,show)=>btn('merge',MERGE,'Merge',dis,show);
const open=(who,r)=>'<button class="ic tp'+(r?' r':'')+'" data-tip="Open the '+who+' thread in T3" aria-label="Open thread in T3">'+OPEN+'</button>';
const st=(k,t,s)=>'<div class="state s-'+k+'">'+(k==='run'?'<span class="spin"></span>':'')+'<div>'+t+(s?'<small>'+s+'</small>':'')+'</div></div>';
const card=c=>'<div class="card"><div class="row"><span class="id">'+c.id+'</span><span class="badge">'+(c.tier||'tier:M')+'</span><span style="flex:1"></span>'+(c.open||'')+'</div><div class="t">'+c.t+'</div>'
 +'<div class="row"><div class="bar"><i style="width:'+((c.d||0)/(c.n||3)*100)+'%"></i></div><span class="cnt">'+(c.d||0)+'/'+(c.n||3)+'</span></div>'+(c.state||'')+(c.act?'<div class="actions">'+c.act+'</div>':'')
 +(c.strands?'<div class="strands">'+c.strands.map(s=>'<div class="strand">'+dot(s[2])+'<span class="sid">'+s[0]+'</span><span style="flex:1">'+s[1]+'</span>'+(s[3]||'')+'</div>').join('')+'</div>':'')+'</div>';
const lane=(n,c,cards)=>'<div class="lane"><h3>'+dot(c)+n+'<span style="flex:1"></span><span>'+cards.length+'</span></h3>'+cards.map(card).join('')+'</div>';
const board=l=>'<div class="lanes" style="grid-template-columns:repeat('+l.length+',minmax(0,1fr))">'+l.join('')+'</div>';
const dlg=h=>'<div class="veil"><div class="dlg">'+h+'</div></div>';
const TODO=(l)=>lane('To Do','l-todo',l||[]),WORK=(l)=>lane('Working','l-prog',l||[]),REV=(l)=>lane('To Review','l-rev',l||[]),DONE=(l)=>lane('Done','l-done',l||[]);
const imp={id:'0014',t:'Sample import',act:start()},aud={id:'0015',t:'Sample audit log',tier:'tier:S',n:2,act:start()};
const rep={id:'0018',t:'Sample reports',d:1,open:open('coordinator')};
const T3='T3 is not connected. Start the T3 app, then reload.';
const startBoard=()=>board([TODO([imp,aud]),WORK([rep]),REV(),DONE()]);
const V={
 start:()=>['1 · Start: a To Do braid card has a Start button and no open button (no thread yet). A Working braid has its open button.',startBoard()],
 confirm:()=>['2 · Start, confirmation: what launches (a new coordinator thread), the model T3 will use, the base branch. Matches BRAID.md here.',startBoard()+dlg('<h2>Start braid 0014?</h2><div class="sub">Sample import · 3 strands, tier M</div><dl class="kv"><dt>Launches</dt><dd>a new <b>coordinator thread</b> in T3 that runs the braid and starts its workers</dd><dt>Model</dt><dd>T3 project default: <code>claude-opus-5-5</code>, effort medium</dd><dt>BRAID.md says</dt><dd><code>claude-opus-5-5</code>, effort medium <span class="ok">✓ same</span></dd><dt>Base branch</dt><dd><code>main</code></dd></dl><div class="btns"><button>Cancel</button><button class="pri">'+PLAY+' Start coordinator</button></div>')],
 warn:()=>['3 · Start, confirmation when T3\'s model differs from BRAID.md: a warning; the user may still start.',startBoard()+dlg('<h2>Start braid 0014?</h2><div class="sub">Sample import · 3 strands, tier M</div>'+st('warn','T3\'s default model differs from BRAID.md','T3 will use <code>claude-sonnet-5-5</code>, BRAID.md names <code>claude-opus-5-5</code>. Change the project default in T3, or start anyway.')+'<dl class="kv"><dt>Launches</dt><dd>a new <b>coordinator thread</b></dd><dt>Model</dt><dd>T3 project default: <code>claude-sonnet-5-5</code>, effort medium</dd><dt>Base branch</dt><dd><code>main</code></dd></dl><div class="btns"><button>Cancel</button><button class="pri">'+PLAY+' Start anyway</button></div>')],
 running:()=>['4 · Start, after confirming: the button waits; on success the card moves to Working with its open button. A failed launch says why on the card and nothing is started.',board([TODO([{id:'0014',t:'Sample import',state:st('run','Starting the coordinator thread…'),act:'<button class="pri" disabled>'+PLAY+' Start</button>'},{id:'0016',t:'Sample themes',tier:'tier:S',state:st('bad','Start failed: T3 refused the thread (project not found)','Nothing was launched. Try again.'),act:start()}]),WORK([{id:'0017',t:'Sample mail',d:0,open:open('coordinator'),state:st('ok','Coordinator started','new thread, just now')}]),REV(),DONE()])],
 merge:()=>['5 · Merge: a strand in To Review has Merge and its open button; the confirmation shows PR, head commit, target branch and checks.',board([TODO(),WORK(),REV([{id:'0010',t:'Sample login flow',tier:'tier:L',d:1,open:open('coordinator'),strands:[['A','Login form','l-done',''],['B','Session storage','l-rev',open('worker',1)+merge()],['C','Password reset','l-todo','']]}]),DONE()])+dlg('<h2>Merge PR #12?</h2><div class="sub">0010/B Session storage</div><dl class="kv"><dt>PR</dt><dd>#12 <code>braid/0010/B-session-storage</code></dd><dt>Head commit</dt><dd><code>a3f9c21</code> feat: store sessions</dd><dt>Merges into</dt><dd><code>braid/0010-sample-login-flow</code></dd><dt>Checks</dt><dd><div class="chk"><span class="ok">'+CHK+'</span>verify (ubuntu-latest)</div><div class="chk"><span class="ok">'+CHK+'</span>verify (windows-latest)</div></dd></dl><div class="cnt">Tells the coordinator that handed over the PR: “Merge #12 at a3f9c21”. The board does not merge itself.</div><div class="btns"><button>Cancel</button><button class="merge">'+MERGE+' Ask coordinator to merge</button></div>')],
 merging:()=>['6 · Merge, after confirming: merging (button off), then merged; the strand moves to Done when the coordinator reports it.',board([REV([{id:'0010',t:'Sample login flow',tier:'tier:L',d:1,open:open('coordinator'),state:st('run','Asked the coordinator to merge #12 at a3f9c21…','sent 14:02'),strands:[['B','Session storage','l-rev',open('worker',1)+'<button class="merge" disabled>'+MERGE+' Merge</button>']]}]),DONE([{id:'0011',t:'Sample search',n:2,d:2,open:open('coordinator'),state:st('ok','Merged #17 at 5be01d4 into braid/0011')}])])],
 refuse:()=>['7 · Merge, refused: the reason is on the card; nothing was merged.',board([REV([{id:'0010',t:'Sample login flow',tier:'tier:L',d:1,open:open('coordinator'),state:st('bad','Not merged: the PR head moved','You confirmed a3f9c21, the PR is now 7d20be4. Check the new commit, then ask again.'),strands:[['B','Session storage','l-rev',open('worker',1)+merge()]]},{id:'0012',t:'Sample export',d:1,open:open('coordinator'),state:st('bad','Not merged: checks are not green','verify (windows-latest) failed.'),strands:[['C','Export tests','l-rev',open('worker',1)+merge()]]}]),WORK()])],
 thread:()=>['8 · Open thread: a small icon button on each card and strand row that has a thread (0018 and its A, B). None on To Do cards or on 0018/C, which has no thread.',board([TODO([imp]),WORK([{id:'0018',t:'Sample reports',d:1,open:open('coordinator'),strands:[['A','Report model','l-prog',open('worker',1)],['B','Report page','l-prog',open('worker',1)],['C','Report export','l-todo','']]}]),REV(),DONE()])],
 disabled:()=>['9 · Disabled actions keep their place; the tooltip gives the reason (pinned open here). Start without T3; Merge with failing or running checks.',board([TODO([{id:'0014',t:'Sample import',act:start(T3,1)}]),REV([{id:'0012',t:'Sample export',d:1,open:open('coordinator'),strands:[['C','Export tests','l-rev',open('worker',1)+merge('Checks failed: verify (windows-latest)',1)],['D','Export docs','l-rev',open('worker',1)+merge('Checks are still running.')]]}]),WORK(),DONE()])]
};
const HP=location.hash.slice(1).split('&');
if(HP.includes('dark')||(!HP.includes('light')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.className='dark';
const r=(V[HP[0]]||V.start)();document.getElementById('note').textContent=r[0];document.getElementById('app').innerHTML=r[1];
</script></body></html>
