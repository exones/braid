<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>braid board – needs-you mockup</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mut:#6b7385;--line:#e2e5ec;--acc:#3b5bdb}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
header b{font-size:16px}header .repo{color:var(--mut)}header .sp{flex:1}
.lanes{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px 20px;align-items:start}
.lane{background:#eceef3;border-radius:10px;padding:10px;min-height:200px}
.lane h3{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px #0001;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card .id{color:var(--mut);font-size:12px}.card .t{font-weight:600;margin:2px 0 6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:#e8ebf3;color:#49506a}
.b-outline{background:#fff1d6;color:#8a5a00}.b-lbl{background:#eef;color:#3b4aa0}
.bar{height:5px;background:#e6e9f0;border-radius:3px;flex:1;min-width:50px;overflow:hidden}.bar i{display:block;height:100%;background:var(--done)}
.cnt{font-size:12px;color:var(--mut)}
.reason{margin-top:6px;font-size:12px;color:#a12a2a;background:#fff5f5;border-radius:6px;padding:4px 6px}
.strands{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.strand{display:flex;gap:6px;align-items:center;padding:4px 0;font-size:13px}
button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
button:disabled{color:#a3a9b8;background:#f3f4f7;cursor:not-allowed}
.actions{margin-top:8px;display:flex;gap:6px}
.page{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 47px)}
nav{background:#fff;border-right:1px solid var(--line);padding:14px;overflow:auto}
nav .back{color:var(--acc);font-size:13px;cursor:pointer;display:block;margin-bottom:10px}
nav h2{font-size:15px;margin:0 0 2px}
nav .item{display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;margin-top:2px}
nav .item.sel{background:#e7ecff;font-weight:600}nav .item:hover{background:#f0f2f8}nav .sub{margin-left:14px}
main{padding:20px 28px;overflow:auto}
main h1{font-size:20px;margin:0 0 6px}
.meta{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:12px 0 16px;font-size:13px}.meta dt{color:var(--mut)}.meta dd{margin:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:7px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent}.tab.on{color:var(--ink);border-color:var(--acc);font-weight:600}
.md h2{font-size:15px;margin:16px 0 4px}.md p,.md li{max-width:75ch}.md code{background:#eef0f5;padding:0 4px;border-radius:4px}
.log{border-left:3px solid var(--line);padding-left:12px;margin:10px 0}.log h4{margin:0;font-size:12px;color:var(--mut);font-weight:600}
.logfile{display:flex;gap:8px;margin-bottom:10px}.logfile .badge{cursor:pointer}.logfile .on{background:var(--acc);color:#fff}
:root{--todo:#cbd5e1;--prog:#2563eb;--rev:#7c3aed;--wait:#f59e0b;--done:#16a34a;--bad:#dc2626}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.l-todo{background:var(--todo)}.l-prog{background:var(--prog)}.l-rev{background:var(--rev)}.l-wait{background:var(--wait)}.l-done{background:var(--done)}
.lane h3{align-items:center}.lane h3 span:first-child{display:flex;align-items:center;gap:6px}
.sid{color:var(--mut);font-size:12px;width:16px;flex:none}
.strand{align-items:center;padding:5px 0}
.ic{width:16px;height:16px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;line-height:1}
.i-q{background:var(--wait)}.i-x{background:var(--bad)}.i-stop{background:var(--bad)}.i-stop b{width:6px;height:6px;background:#fff;border-radius:1px;display:block}
.i-flag{background:none;color:var(--wait)}
.i-ag{background:none;color:var(--prog);animation:wob 2s ease-in-out infinite}.i-tick{background:none;color:var(--done)}.i-eye{background:none;color:var(--rev)}@keyframes wob{50%{transform:rotate(-12deg)}}
.icons{display:inline-flex;gap:5px;align-items:center}
.note{padding:6px 20px;color:var(--mut);font-size:12px}
.legend{display:grid;grid-template-columns:auto auto 1fr;gap:10px 14px;align-items:center;padding:20px 28px;font-size:13px;max-width:760px}
.legend h2{grid-column:1/-1;margin:8px 0 0;font-size:14px}.legend code{background:#eef0f5;padding:0 4px;border-radius:4px}
</style></head><body>
<style>
.need{margin-top:6px;font-size:12.5px;border-radius:6px;padding:4px 7px;line-height:1.35}
.need small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.n-wait{background:#fff6e0;color:#7a4d00;border-left:3px solid var(--wait)}
.n-bad{background:#fff1f1;color:#8f1f1f;border-left:3px solid var(--bad)}
.n-rev{background:#f1ecff;color:#4a2a9a;border-left:3px solid var(--rev)}
.who{font-size:11px;color:var(--mut);margin-top:6px}
.ic.i-plan{background:none;color:var(--wait)}.ic.i-stall{background:none;color:var(--bad)}.ic.i-ci{background:none;color:var(--prog)}.ic.i-rv{background:none;color:var(--prog)}
.i-ci svg{animation:spin 1.6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.strand{flex-wrap:wrap}.strand .need{flex-basis:100%;margin:0 0 4px 30px;font-size:12px}
.lane.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}.lane.grid h3{grid-column:1/-1}.lane.grid .card{margin:0}
.banner{margin:14px 0;padding:10px 14px;border-radius:8px;max-width:75ch}
.banner b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.banner .btns{margin-top:8px;display:flex;gap:6px}
</style></head><body>
<header><b>braid · attention board</b><span class="repo">Each braid sits in the lane where it needs you most. · sample · braids/</span><span class="sp"></span><span class="cnt">read-only · refreshes every 30 s</span></header>
<div class="note" id="note"></div><div id="app"></div>
<script>
const svg=(p,w)=>'<svg width="'+(w||15)+'" height="'+(w||15)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const ic=(c,t,inner)=>'<span class="ic '+c+'" title="'+t+'" aria-label="'+t+'">'+inner+'</span>';
const EYEP='<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
const I={
 q:ic('i-q','Question: waiting for your answer','?'),
 flag:k=>ic('i-flag','Decision needed: '+k,'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 2h2v20H5zM8 3h12l-3 5 3 5H8z"/></svg>'),
 plan:ic('i-plan','Plan approval needed',svg('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>')),
 x:ic('i-x','Checks failed: verify (windows-latest)','✕'),
 stall:ic('i-stall','Stalled: nobody is working and nothing was asked',svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')),
 ag:ic('i-ag','agent running',svg('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8 6.2 21l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>')),
 ci:ic('i-ci','checks running',svg('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>')),
 rv:ic('i-rv','review running',svg(EYEP)),
 eye:n=>ic('i-eye','PR #'+n+' to review',svg(EYEP)),
 tick:ic('i-tick','Done',svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'))};
const cls={'To Do':'l-todo','Working':'l-prog','To Review':'l-rev','Needs You':'l-wait','Done':'l-done'};
const dot=l=>'<span class="dot '+cls[l]+'"></span>';
// strand: [letter,title,lane,icons[],need,kind,age]; braid-level request: ask
const NEED=(k,t,age)=>'<div class="need n-'+k+'">'+t+'<small>asked '+age+'</small></div>';
const B=[
{id:'0010',title:'Sample login flow',tier:'tier:L',strands:[['A','Login form','Done',[I.tick]],['B','Session storage','To Review',[I.eye(12)],'Merge PR #12','rev','2 h ago'],['C','Password reset','To Do',[]]]},
{id:'0011',title:'Sample search',tier:'tier:M',strands:[['A','Search index','Working',[I.ag]],['B','Search page','Needs You',[I.x],'Checks failed: verify (windows-latest); fix or retry','bad','14 min ago']]},
{id:'0012',title:'Sample export',tier:'tier:M',strands:[['A','CSV export','Needs You',[I.q],'Which date format should the CSV use, ISO or local?','wait','35 min ago'],['B','PDF export','Needs You',[I.flag('approve-layout')],'Decide: approve the PDF layout (approve-layout)','wait','1 h ago'],['C','Export tests','To Review',[I.eye(17)],'Merge PR #17','rev','3 h ago']]},
{id:'0013',title:'Sample billing',tier:'tier:S',strands:[['A','Invoice page','Needs You',[I.stall],'Stalled: nobody is working and nothing was asked','bad','25 min ago']]},
{id:'0014',title:'Sample import',tier:'tier:M',ask:{icons:[I.plan],need:'Approve the plan: 3 strands, A to C',kind:'wait',age:'20 min ago'},strands:[['A','Parser','To Do',[]],['B','Mapper','To Do',[]],['C','Report','To Do',[]]]},
{id:'0015',title:'Sample audit log',tier:'tier:M',ask:{icons:[I.flag('spike-direction')],need:'Decide: which spike option to build (spike-direction)',kind:'wait',age:'2 h ago'},strands:[['A','Spike: storage options','Done',[I.tick]]]},
{id:'0016',title:'Sample themes',tier:'tier:S',strands:[['A','Colour tokens','Working',[I.ci]],['B','Dark mode','To Do',[]]]},
{id:'0018',title:'Sample reports',tier:'tier:M',strands:[['A','Report model','Working',[I.ag]],['B','Report page','Working',[I.ag]],['C','Report export','To Do',[]]]},
{id:'0019',title:'Sample cache',tier:'tier:S',strands:[['A','Cache layer','Working',[I.rv]]]},
{id:'0017',title:'Sample mail',tier:'tier:S',strands:[['A','Send mail','Done',[I.tick]]]},
];
const ORDER=['Needs You','To Review','Working','To Do','Done'];
const laneOf=b=>b.ask?'Needs You':ORDER.find(l=>b.strands.some(s=>s[2]===l));
const pick=b=>{if(b.ask)return {n:b.ask.need,k:b.ask.kind,a:b.ask.age,who:null};
 const s=b.strands.filter(s=>s[4]).sort((x,y)=>ORDER.indexOf(x[2])-ORDER.indexOf(y[2]))[0];return s&&{n:s[4],k:s[5],a:s[6],who:b.id+'/'+s[0]}};
const marks=b=>{const seen=[];const add=h=>{if(!seen.includes(h))seen.push(h)};if(b.ask)b.ask.icons.forEach(add);
 ORDER.forEach(l=>b.strands.filter(s=>s[2]===l).forEach(s=>s[3].forEach(add)));return '<span class="icons">'+seen.join('')+'</span>'};
function card(b,open){const done=b.strands.filter(s=>s[2]==='Done').length,n=b.strands.length,t=pick(b);
 const more=b.strands.filter(s=>s[4]).length-(t&&t.who?1:0);
 const line=t&&laneOf(b)!=='Working'?'<div class="need n-'+t.k+'">'+t.n+'<small>'+(more>0&&laneOf(b)!=='Working'?'+'+more+' more in strands · ':'')+(t.who?'strand '+t.who:'braid, no strand involved')+' · asked '+t.a+'</small></div>':'';
 return '<div class="card"><div class="row"><span class="id">'+b.id+'</span><span class="badge">'+b.tier+'</span>'+marks(b)+'<span style="flex:1"></span><span class="cnt">'+(open?'▾':'▸')+' strands</span></div><div class="t">'+b.title+'</div>'
 +'<div class="row"><div class="bar"><i style="width:'+(done/n*100)+'%"></i></div><span class="cnt">'+done+'/'+n+'</span></div>'+line
 +(open?'<div class="strands">'+b.strands.map(s=>'<div class="strand">'+dot(s[2])+'<span class="sid">'+s[0]+'</span><span style="flex:1">'+s[1]+'</span><span class="icons">'+s[3].join('')+'</span>'+(s[4]?NEED(s[5],s[4],s[6]):'')+'</div>').join('')+'</div>':'')+'</div>'}
function board(ids,open,cols){const L=['To Do','Working','To Review','Needs You','Done'].filter(l=>!cols||cols.includes(l));
 return '<div class="lanes" style="grid-template-columns:repeat('+L.length+',1fr)">'+L.map(l=>{const c=B.filter(b=>laneOf(b)===l&&(!ids||ids.includes(b.id)));return '<div class="lane'+(cols&&cols.length===1?' grid':'')+'"><h3><span>'+dot(l)+l+'</span><span>'+c.length+'</span></h3>'+c.map(b=>card(b,open&&open.includes(b.id))).join('')+'</div>'}).join('')+'</div>'}
function page(b){const t=pick(b);
 return '<div class="page"><nav><a class="back">← Board</a><h2>'+b.id+' '+b.title+'</h2><div class="cnt" style="display:flex;gap:6px;align-items:center">'+dot(laneOf(b))+'Needs You '+marks(b)+'</div><div class="item sel">Braid brief</div>'
 +b.strands.map(x=>'<div class="item sub">'+dot(x[2])+'<span style="flex:1">'+x[0]+' · '+x[1]+'</span><span class="icons">'+x[3].join('')+'</span></div>').join('')+'</nav>'
 +'<main><div class="cnt">'+b.id+'</div><h1>'+b.title+'</h1><div class="banner n-'+t.k+'"><b>Needs you · asked '+t.a+'</b>'+t.n+'<div class="who">Answer in the coordinator thread; the card leaves Needs You when the coordinator acts.</div></div><p class="cnt">(Brief, plan and tabs unchanged.)</p></main></div>'}
function legend(){const r=(i,n,h)=>'<span>'+i+'</span><span><code>'+n+'</code></span><span>'+h+'</span>';
 return '<div class="legend"><h2>Needs You: the icon says why, the line says what</h2>'
 +r(I.q,'question','"Question: waiting for your answer"')+r(I.flag('scope'),'decision','"Decision needed: &lt;stop-case key&gt;"; the key also ends the line')
 +r(I.plan,'plan approval','new icon: "Plan approval needed"')+r(I.x,'checks failed','after 10 min, no agent running')+r(I.stall,'stalled','new icon: after 10 min, nobody working, nothing asked')
 +'<h2>To Review</h2>'+r(I.eye(12),'review','"PR #12 to review"; line: "Merge PR #12", with the age of the request')
 +'<h2>Working (no extra lane)</h2>'+r(I.ag,'agent running','worker or reviewer agent')+r(I.ci,'checks running','new icon, spins; only CI is running')+r(I.rv,'review running','new icon; only a review is running')
 +'<h2>Done</h2>'+r(I.tick,'done','')+'</div>'}
const h=location.hash.slice(1),A=document.getElementById('app'),N=document.getElementById('note');
const V={
 board:()=>{N.textContent='1 · The board. Cards on your side carry one line saying what is needed; Working and To Do cards stay quiet.';return board(null,['0012'])},
 needs:()=>{N.textContent='2 · Needs You, one reason each: question, decision (stop-case key), plan approval, checks failed, stalled. Strand rows repeat the line.';return board(['0012','0011','0013','0014'],[],['Needs You'])},
 braids:()=>{N.textContent='3 · A strand needs you (0012, line names the strand) vs the coordinator asked (0014, 0015: no strand involved), and a To Review card with PR and age of the request.';return board(['0012','0015','0010','0014'],['0010'],['To Review','Needs You'])},
 working:()=>{N.textContent='4 · Working: agents running (wrench), only CI running (spinner), only a review running (eye). Same lane, no request line, nothing asked of you.';return board(['0018','0016','0019'],['0018','0016','0019'],['Working'])},
 legend:()=>{N.textContent='5 · Legend. Two new reason icons (plan, stalled), two for Working detail (checks, review).';return legend()},
 page:()=>{N.textContent='6 · A braid page shows the request as a banner above the brief, same text as the card.';return page(B.find(b=>b.id==='0014'))}};
A.innerHTML=(V[h]||V.board)();
</script></body></html>
