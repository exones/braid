<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>braid board 0034 - details shape mockups</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mut:#6b7385;--line:#e2e5ec;--acc:#3b5bdb}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);height:47px}
header b{font-size:16px}.mut,.cnt{color:var(--mut);font-size:12px}.sp{flex:1}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;padding:16px 20px;align-items:start;overflow:auto;height:calc(100% - 47px)}
.lane{background:#eceef3;border-radius:10px;padding:10px;min-height:200px}
.lane h3{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px #0001}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px #3b5bdb33}
.card .t{font-weight:600;margin:2px 0 6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:#e8ebf3;color:#49506a}.b-lbl{background:#eef;color:#3b4aa0}
.bar{height:5px;background:#e6e9f0;border-radius:3px;flex:1;min-width:50px;overflow:hidden}.bar i{display:block;height:100%;background:#37b24d}
.reason{margin-top:6px;font-size:12px;color:#a12a2a;background:#fff5f5;border-radius:6px;padding:4px 6px}
.dot{width:8px;height:8px;border-radius:50%;background:#adb5bd;flex:none}.d-prog{background:#3b5bdb}.d-done{background:#37b24d}.d-wait{background:#e03131}
button{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{color:#a3a9b8;background:#f3f4f7}
.scrim{position:fixed;inset:47px 0 0 0;background:#1d233022}
.modal-scrim{position:fixed;inset:0;background:#1d233066;display:flex;align-items:center;justify-content:center}
.det{background:#fff;display:flex;flex-direction:column;min-height:0}
.panel{position:fixed;top:47px;right:0;bottom:0;width:min(560px,46vw);border-left:1px solid var(--line);box-shadow:-8px 0 24px #0002}
.modal{width:min(980px,86vw);height:min(720px,86vh);border-radius:12px;box-shadow:0 12px 48px #0004;overflow:hidden}
.dh{display:flex;align-items:flex-start;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.dh h1{font-size:18px;margin:0}.x{font-size:18px;line-height:1;padding:4px 9px}
.body{display:flex;flex:1;min-height:0}
.rail{width:230px;flex:none;border-right:1px solid var(--line);padding:12px;overflow:auto;background:#fafbfc}
.rail .it{display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:6px;margin-top:2px;font-size:13px}.rail .sel{background:#e7ecff;font-weight:600}
.chips{display:flex;gap:6px;padding:10px 18px 0;overflow:auto;flex:none}
.chip{white-space:nowrap;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);display:flex;gap:5px;align-items:center}.chip.sel{background:#e7ecff;border-color:#b7c4f5;font-weight:600}
.main{flex:1;overflow:auto;padding:14px 18px;min-width:0}
.banner{background:#fff5f5;border:1px solid #f3c5c5;border-radius:8px;padding:8px 10px;color:#8f2323;margin:10px 0;font-size:13px}
.meta{display:grid;grid-template-columns:100px 1fr;gap:4px 12px;margin:10px 0 12px;font-size:13px}.meta dt{color:var(--mut)}.meta dd{margin:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{padding:6px 14px;color:var(--mut);border-bottom:2px solid transparent}.tab.on{color:var(--ink);border-color:var(--acc);font-weight:600}
.md h2{font-size:15px;margin:14px 0 4px}.md p,.md li{max-width:75ch}.md code{background:#eef0f5;padding:0 4px;border-radius:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.note{position:fixed;left:16px;bottom:10px;font-size:12px;color:var(--mut);background:#fffc;padding:2px 8px;border-radius:6px}
.grab{display:none;width:40px;height:4px;border-radius:2px;background:#cfd3de;margin:8px auto 0}
.back{display:none}
@media (max-width:700px){
 .lanes{grid-template-columns:repeat(5,80vw);scroll-snap-type:x mandatory}.lane{scroll-snap-align:start}
 .panel{inset:0;width:auto;border:0;box-shadow:none}
 .modal-scrim{display:block}
 .modal{position:fixed;inset:28px 0 0 0;width:auto;height:auto;border-radius:14px 14px 0 0;box-shadow:0 -6px 24px #0004}
 .grab{display:block}
 .rail{display:none}
 .dh{padding:12px 14px}.main{padding:12px 14px}.chips{padding:8px 14px 0}.meta{grid-template-columns:90px 1fr}
 .back{display:inline}
}
</style></head><body>
<header><b>braid</b><span class="mut">agento · braids/</span><span class="sp"></span><span class="mut">Board · Inbox</span></header>
<div id="app"></div>
<script>
const q=new URLSearchParams(location.hash.slice(1));
const shape=q.get('shape')||'panel',item=q.get('item')||'0003',strand=q.get('s')||'';
const B=[
{id:'0003',t:'Board: live refresh',lane:'In Progress',lbl:['kind:epic','ui','tier:L'],S:[['A','Board skeleton','Done'],['B','Live copies from branches','In Progress'],['C','GitHub states','To Do'],['D','T3 threads','To Do']]},
{id:'0005',t:'Review reminders',lane:'Waiting',lbl:['kind:story','tier:M'],reason:'Needs the user: scope. The brief asks for email, the repo has no mail setup.',S:[['A','Detect stale reviews','Waiting']]},
{id:'0004',t:'Start and Merge actions',lane:'To Do',lbl:['kind:story','tier:L'],S:[['A','Start an agent from a card','To Do'],['B','Merge on request','To Do']]},
{id:'0008',t:'Release checklist',lane:'In Review',lbl:['kind:story','tier:S'],S:[]},
{id:'0001',t:'Fresh start',lane:'Done',lbl:['kind:story','tier:S'],S:[]}];
const L=['To Do','In Progress','In Review','Waiting','Done'];
const dot=s=>({'In Progress':'d-prog','Done':'d-done','Waiting':'d-wait'}[s]||'');
const card=b=>{const d=b.S.filter(s=>s[2]==='Done').length,n=b.S.length;
 return `<div class="card ${b.id===item?'sel':''}"><div class="row"><span class="mut">${b.id}</span>${b.lbl.filter(l=>l.startsWith('tier')).map(l=>`<span class="badge">${l}</span>`).join('')}</div><div class="t">${b.t}</div>${n?`<div class="row"><div class="bar"><i style="width:${d/n*100}%"></i></div><span class="cnt">${d}/${n}</span></div>`:''}${b.reason?`<div class="reason">${b.reason}</div>`:''}<div class="row" style="margin-top:8px"><button disabled>Start</button><button disabled>Merge</button></div></div>`};
const board=`<div class="lanes">${L.map(l=>`<div class="lane"><h3><span>${l}</span><span>${B.filter(b=>b.lane===l).length}</span></h3>${B.filter(b=>b.lane===l).map(card).join('')}</div>`).join('')}</div>`;
const b=B.find(x=>x.id===item),s=strand&&b.S.find(x=>x[0]===strand);
const title=s?s[1]:b.t,status=s?s[2]:b.lane;
const nav=(rail)=>`<div class="${rail?'rail':'chips'}">${rail?`<div class="mut" style="margin-bottom:6px">${b.id} · ${b.S.length} strands</div>`:''}<div class="${rail?'it':'chip'} ${!s?'sel':''}">Braid brief</div>${b.S.map(x=>`<div class="${rail?'it':'chip'} ${s&&s[0]===x[0]?'sel':''}"><span class="dot ${dot(x[2])}"></span>${x[0]} · ${x[1]}</div>`).join('')}</div>`;
const brief='<div class="md"><h2>Goal</h2><p>Keep the board current while agents work, without a reload.</p><h2>Change</h2><ul><li>Poll the board data and merge it in place.</li><li>Show the live copy of each branch\'s brief.</li></ul><h2>Acceptance</h2><ul><li>A status change shows within 5 s.</li><li><code>npm run verify</code> passes.</li></ul></div>';
const head=`<div class="dh"><div style="flex:1;min-width:0"><div class="mut"><a class="back" style="color:var(--acc)">← Board</a> ${b.id}${s?'/'+s[0]:''}</div><h1>${title}</h1><div class="row" style="margin-top:6px"><span class="badge">${status}</span>${b.lbl.map(l=>`<span class="badge b-lbl">${l}</span>`).join('')}</div></div><button class="x" title="Close (Esc)">✕</button></div>`;
const content=`${s&&s[2]==='Waiting'?`<div class="banner"><b>Waiting for you</b> - scope: the brief asks for email, the repo has no mail setup. Answer in the coordinator's thread.</div>`:''}<div class="acts"><button>Open thread</button><button>Coordinator</button><button class="pri">Start</button><button>Merge</button></div><dl class="meta"><dt>Status</dt><dd>${status}</dd><dt>Delivery</dt><dd>epic</dd><dt>Depends on</dt><dd>${s&&s[0]!=='A'?b.id+'/A':'–'}</dd><dt>PR</dt><dd>#${s?161:158} · checks green</dd></dl><div class="tabs"><div class="tab on">Brief</div><div class="tab">Report</div><div class="tab">Logs (2)</div></div>${brief}`;
const wide=innerWidth>700;
let html=board;
if(shape==='panel')html+=`<div class="scrim"></div><aside class="det panel">${head}${nav(false)}<div class="main">${content}</div></aside>`;
else html+=`<div class="modal-scrim"><div class="det modal"><div class="grab"></div>${head}<div class="body">${wide?nav(true):''}<div style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden">${wide?'':nav(false)}<div class="main">${content}</div></div></div></div></div>`;
html+=`<div class="note">#/${item}${strand?'/'+strand:''}?tab=brief · ${shape}</div>`;
document.getElementById('app').innerHTML=html;
</script></body></html>
